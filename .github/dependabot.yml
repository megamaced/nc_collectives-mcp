# The repo previously relied on Renovate running against a Gitea mirror. That
# mirror is retired, so GitHub had no dependency automation at all — which is
# how the MCP SDK sat on 8 high-severity advisories until v0.3.0.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # One PR for routine dev-tooling churn; production and major bumps stay
      # separate so they get read properly.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # The SDK defines the tool contract — take majors deliberately, not on a
      # bot's schedule.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-major"]

  # Catches the deprecated-runtime bumps that CI currently warns about (#28).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    labels:
      - dependencies
